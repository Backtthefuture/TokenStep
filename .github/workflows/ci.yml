name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      # Test fixtures encode day boundaries in this zone.
      TOKENSTEP_TIMEZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Check release safety contract
        run: ./script/test_release_contract.sh
      - name: Run Swift tests
        run: swift test --package-path TokenStepSwift
      - name: Run usage collector fixture checks
        run: ./script/test_ccswitch_proxy_collector.sh
      - name: Run Codex cumulative accounting checks
        run: ./script/test_codex_cumulative_collector.sh
      - name: Run accounting migration checks
        run: ./script/test_usage_recalibration_migration.sh
      - name: Run time zone collector checks
        run: ./script/test_time_zone_collector.sh
      - name: Run Claude incremental collector checks
        run: ./script/test_claude_incremental_collector.sh
      - name: Run settings Codable checks
        run: ./script/test_settings_codable.sh
      - name: Run compact popover checks
        run: ./script/test_compact_popover.sh
      - name: Run Today overview checks
        run: ./script/test_today_overview.sh
      - name: Build TokenStep
        run: ./script/build_swiftui_and_run.sh --no-launch
